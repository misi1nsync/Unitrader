[project]
name = "unitrader"
version = "0.1.0"
description = "Market data ingestion and trading research tools"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unitrader-ingest = "unitrader.ingest:main"
unitrader-signal = "unitrader.signals:main"
unitrader-run = "unitrader.run:main"
unitrader-backfill = "unitrader.history:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["unitrader"]

[tool.setuptools.package-data]
unitrader = ["skills/*/SKILL.md", "skills/*/schema.json"]
